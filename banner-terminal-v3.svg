<svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5F2E1B"/>
      <stop offset="50%" stop-color="#D97B4A"/>
      <stop offset="100%" stop-color="#5F2E1B"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141413"/>
      <stop offset="100%" stop-color="#020403"/>
    </linearGradient>
    <filter id="nameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="1.5;4;1.5" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="896" height="176" rx="14" fill="url(#bgGrad)"
        stroke="url(#borderGlow)" stroke-width="2"/>

  <circle cx="34" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="56" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="34" r="6" fill="#27c93f"/>
  <text x="450" y="39" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A8A29A">mibrahim-O2@dev — ai</text>

  <line x1="24" y1="52" x2="876" y2="52" stroke="#1A2324" stroke-width="1"/>

  <!-- Small "whoami" label, left aligned -->
  <text x="40" y="80" font-family="'JetBrains Mono', monospace" font-size="15" fill="#A8A29A" opacity="0">
    <animate attributeName="opacity" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <tspan fill="#D97B4A">$ </tspan>whoami
  </text>

  <!-- Big centered name -->
  <text x="450" y="128" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800"
        font-size="44" fill="#D97B4A" filter="url(#nameGlow)" opacity="0">
    <animate attributeName="opacity" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="0.9;1;1" dur="0.6s" begin="0.9s" fill="freeze"/>
    <animate attributeName="fill" values="#D97B4A;#F0A070;#D97B4A" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    MUHAMMAD IBRAHIM
  </text>

  <!-- Role, centered below -->
  <text x="450" y="160" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#7FA3A6" opacity="0">
    <animate attributeName="opacity" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
    Full-Stack Developer · AI Integration Engineer
  </text>

  <!-- Blinking cursor after role -->
  <rect x="737" y="148" width="9" height="16" fill="#F0A070" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" dur="0.9s" repeatCount="indefinite" begin="2.1s"/>
  </rect>
</svg>
